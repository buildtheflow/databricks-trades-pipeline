name: Trades Medallion Pipeline — CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main

jobs:

  # ── Job 1: Unit tests — runs on every push and PR ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyspark==3.5.0 delta-spark==3.0.0 pytest pyyaml
        env:
          PYTHONPATH: src

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ── Job 2: Deploy to dev — runs on push to dev branch ─────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks auth
        run: |
          mkdir -p ~/.databrickscfg || true
          printf '[DEFAULT]\nhost = %s\ntoken = %s\n' \
            "${{ secrets.DATABRICKS_HOST }}" \
            "${{ secrets.DATABRICKS_TOKEN }}" > ~/.databrickscfg
          cat ~/.databrickscfg

      - name: Verify auth
        run: |
          databricks auth describe

      - name: Deploy to dev
        run: |
          databricks bundle deploy --target dev

      - name: Run dev pipeline
        run: |
          databricks bundle run trades_medallion_full --target dev

      - name: Validate dev counts
        run: |
          databricks statement-execution execute-statement \
            --warehouse-id ${{ secrets.DATABRICKS_WAREHOUSE_ID }} \
            --statement "SELECT 'bronze' as layer, COUNT(*) as rows FROM finmarket_dev.bronze.trades UNION ALL SELECT 'silver', COUNT(*) FROM finmarket_dev.silver.trades UNION ALL SELECT 'gold', COUNT(*) FROM finmarket_dev.gold.trade_summary" \
            --catalog finmarket_dev

  # ── Job 3: Deploy to prod — runs on push to main branch ───────────────────
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Configure Databricks auth
        run: |
          printf '[DEFAULT]\nhost = %s\ntoken = %s\n' \
            "${{ secrets.DATABRICKS_HOST }}" \
            "${{ secrets.DATABRICKS_TOKEN }}" > ~/.databrickscfg

      - name: Verify auth
        run: |
          databricks auth describe

      - name: Deploy to prod
        run: |
          databricks bundle deploy --target prod

      - name: Run prod pipeline
        run: |
          databricks bundle run trades_medallion_full --target prod

      - name: Validate prod counts
        run: |
          databricks statement-execution execute-statement \
            --warehouse-id ${{ secrets.DATABRICKS_WAREHOUSE_ID }} \
            --statement "SELECT 'bronze' as layer, COUNT(*) as rows FROM finmarket.bronze.trades UNION ALL SELECT 'silver', COUNT(*) FROM finmarket.silver.trades UNION ALL SELECT 'gold', COUNT(*) FROM finmarket.gold.trade_summary" \
            --catalog finmarket
