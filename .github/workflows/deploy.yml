name: Trades Medallion Pipeline — CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev
      - main

jobs:

  # ── Job 1: Unit tests — runs on every push and PR ──────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pyspark==3.5.0 delta-spark==3.0.0 pytest pyyaml
        env:
          PYTHONPATH: src

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
        env:
          PYTHONPATH: src

  # ── Job 2: Deploy to dev — runs on push to dev branch ─────────────────────
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to dev
        run: |
          databricks bundle deploy --target dev

      - name: Run dev pipeline and validate
        run: |
          echo "Running dev pipeline..."
          OUTPUT=$(databricks bundle run trades_medallion_full --target dev 2>&1)
          echo "Pipeline output:"
          echo "$OUTPUT"

          # Validate SUCCESS status
          if echo "$OUTPUT" | grep -q '"status": "SUCCESS"'; then
            echo "✓ Pipeline status: SUCCESS"
          else
            echo "✗ Pipeline did not return SUCCESS status"
            exit 1
          fi

          # Validate Bronze count
          if echo "$OUTPUT" | grep -q '"rows_written": 10'; then
            echo "✓ Bronze count validated: 10 rows"
          else
            echo "WARNING: Bronze count unexpected — check finmarket_dev.bronze.trades"
          fi

          # Validate Silver count
          if echo "$OUTPUT" | grep -q '"rows_written": 8'; then
            echo "✓ Silver count validated: 8 rows"
          else
            echo "WARNING: Silver count unexpected — check finmarket_dev.silver.trades"
          fi

          # Validate quarantine count
          if echo "$OUTPUT" | grep -q '"rows_quarantined": 2'; then
            echo "✓ Quarantine count validated: 2 rows"
          else
            echo "WARNING: Quarantine count unexpected — check finmarket_dev.silver.trades_quarantine"
          fi

  # ── Job 3: Deploy to prod — runs on push to main branch ───────────────────
  deploy-prod:
    name: Deploy to Prod
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment: production

    env:
      DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        run: |
          curl -fsSL https://raw.githubusercontent.com/databricks/setup-cli/main/install.sh | sh

      - name: Deploy to prod
        run: |
          databricks bundle deploy --target prod

      - name: Run prod pipeline and validate
        run: |
          echo "Running prod pipeline..."
          OUTPUT=$(databricks bundle run trades_medallion_full --target prod 2>&1)
          echo "Pipeline output:"
          echo "$OUTPUT"

          # Validate SUCCESS status
          if echo "$OUTPUT" | grep -q '"status": "SUCCESS"'; then
            echo "✓ Pipeline status: SUCCESS"
          else
            echo "✗ Pipeline did not return SUCCESS status"
            exit 1
          fi

          # Validate Bronze count
          if echo "$OUTPUT" | grep -q '"rows_written": 10'; then
            echo "✓ Bronze count validated: 10 rows"
          else
            echo "WARNING: Bronze count unexpected — check finmarket.bronze.trades"
          fi

          # Validate Silver count
          if echo "$OUTPUT" | grep -q '"rows_written": 8'; then
            echo "✓ Silver count validated: 8 rows"
          else
            echo "WARNING: Silver count unexpected — check finmarket.silver.trades"
          fi

          # Validate quarantine count
          if echo "$OUTPUT" | grep -q '"rows_quarantined": 2'; then
            echo "✓ Quarantine count validated: 2 rows"
          else
            echo "WARNING: Quarantine count unexpected — check finmarket.silver.trades_quarantine"
          fi
