bundle:
  name: trades-medallion-pipeline

variables:
  repo_path:
    description: "Path to notebook in Databricks Repos"
    default: "/Users/rakesh.singh1004@gmail.com/databricks-trades-pipeline"

targets:

  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-4e2ef701-b36a.cloud.databricks.com
    variables:
      repo_path: "/Users/rakesh.singh1004@gmail.com/databricks-trades-pipeline"

  prod:
    mode: production
    workspace:
      host: https://dbc-4e2ef701-b36a.cloud.databricks.com
      root_path: /Workspace/Users/rakesh.singh1004@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      repo_path: "/Workspace/PROD/databricks-trades-pipeline"      

resources:
  jobs:

    # Full pipeline — Bronze → Silver → Gold
    trades_medallion_full:
      name: "Trades Medallion — Full Pipeline"
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "America/New_York"
        pause_status: PAUSED        # unpause when ready for prod
      max_concurrent_runs: 1
      tasks:
        - task_key: medallion_orchestrator
          notebook_task:
            notebook_path: ${var.repo_path}/notebooks/pipeline_orchestrator
            base_parameters:
              env:   "dev"
              layer: "all"

    # Repair jobs — rerun a single layer without touching others
    trades_medallion_bronze_only:
      name: "Trades Medallion — Bronze only"
      tasks:
        - task_key: bronze_only
          notebook_task:
            notebook_path: ${var.repo_path}/notebooks/pipeline_orchestrator
            base_parameters:
              env:   "dev"
              layer: "bronze"

    trades_medallion_silver_only:
      name: "Trades Medallion — Silver only"
      tasks:
        - task_key: silver_only
          notebook_task:
            notebook_path: ${var.repo_path}/notebooks/pipeline_orchestrator
            base_parameters:
              env:   "dev"
              layer: "silver"

    trades_medallion_gold_only:
      name: "Trades Medallion — Gold only"
      tasks:
        - task_key: gold_only
          notebook_task:
            notebook_path: ${var.repo_path}/notebooks/pipeline_orchestrator
            base_parameters:
              env:   "dev"
              layer: "gold"
